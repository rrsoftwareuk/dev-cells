{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% load static %}
{% block content %}

{#    if (!localStorage.getItem("visited")) {window.location.href = "/login";}});#}
{#</script>#}


<div class="entry-form-container">
    <div class="entry-form">
        <h2 class="entry-form-label">Login</h2>
        
        <form method="POST">
            {% csrf_token %}

            <div class="field"> 
                <label class="label">Username</label>
                <div class="control has-icons-left has-icons-right">
                    <input class="input" type="text" name="username" placeholder="Enter username">
                    <span class="icon is-small is-left"><i class="fa fa-user"></i></span>
                </div>
            </div>

            <div class="field">
                <label class="label">Password</label>
                <div class="control has-icons-left has-icons-right">
                    <input class="input" type="password" name="password" placeholder="Enter Password">
                    <span class="icon is-small is-left"><i class="fa fa-lock"></i></span>
                </div>
            </div>

            {% if error %}
                <p class="has-text-danger pb-2">{{ error }}</p>
            {% endif %}

            <div class="entry-form-cta">
                <button type="submit" class="primary-button">Login</button>
            </div>

        </form>

        <p class=" is-size-7 has-text-centered mb-4">Don't have an account? <a href="{% url 'signup' %}">Sign Up</a></p>
        
    </div>
</div>

<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
